name: Finish branch cleanup

on:
  push:
    branches:
      - agent/cleanup-and-python-314

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Apply focused cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "${BRANCH}"
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path


          def remove_named_functions(path: Path, names: set[str]) -> None:
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              tree = ast.parse(text)
              ranges: list[tuple[int, int]] = []
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names:
                      ranges.append((node.lineno - 1, node.end_lineno or node.lineno))
              for start, end in sorted(ranges, reverse=True):
                  while start > 0 and not lines[start - 1].strip():
                      start -= 1
                  del lines[start:end]
              path.write_text("".join(lines), encoding="utf-8")


          def remove_tests_using(path: Path, needles: tuple[str, ...]) -> None:
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              tree = ast.parse(text)
              ranges: list[tuple[int, int]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  segment = ast.get_source_segment(text, node) or ""
                  if node.name.startswith("test_") and any(n in segment for n in needles):
                      start = node.lineno - 1
                      decorators = [d.lineno - 1 for d in node.decorator_list]
                      if decorators:
                          start = min(start, *decorators)
                      ranges.append((start, node.end_lineno or node.lineno))
              for start, end in sorted(ranges, reverse=True):
                  while start > 0 and not lines[start - 1].strip():
                      start -= 1
                  del lines[start:end]
              path.write_text("".join(lines), encoding="utf-8")


          trading = Path("mt5cli/trading.py")
          remove_named_functions(trading, {"calculate_new_position_margin_ratio"})
          text = trading.read_text(encoding="utf-8")
          text = text.replace('    "calculate_new_position_margin_ratio",\n', "")
          trading.write_text(text, encoding="utf-8")

          remove_tests_using(
              Path("tests/unit/test_trading.py"),
              ("calculate_new_position_margin_ratio",),
          )

          for path in Path(".").rglob("*.md"):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "`calculate_margin_and_volume`, `calculate_volume_by_margin`, `calculate_new_position_margin_ratio`",
                  "`calculate_margin_and_volume`, `calculate_volume_by_margin`, `calculate_account_projected_margin_ratio`",
              )
              lines = []
              for line in text.splitlines(keepends=True):
                  if "calculate_new_position_margin_ratio" in line:
                      continue
                  if re.search(r"Python\s+3\.11\+", line, flags=re.IGNORECASE):
                      continue
                  if re.search(r"Python\s*>=?\s*3\.11", line, flags=re.IGNORECASE):
                      continue
                  lines.append(line)
              path.write_text("".join(lines), encoding="utf-8")
          PY
          rm -f .github/workflows/agent-finish-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finish legacy API cleanup"
          git push origin "HEAD:${BRANCH}"
