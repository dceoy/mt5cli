name: Align branch SDK docs

on:
  push:
    branches:
      - agent/cleanup-and-python-314

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Align contract docs and tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "${BRANCH}"
          python - <<'PY'
          from pathlib import Path

          docs = Path("docs/api/public-contract.md")
          text = docs.read_text(encoding="utf-8")
          text = text.replace(
              "Helpers promoted for downstream use, including\nconfiguration types, selected parsing utilities, history timeframe resolution,\nand Grafana schema setup, are part of that root contract.",
              "Helpers promoted for downstream use, including selected configuration and\nparsing utilities, history timeframe resolution, and Grafana schema setup, are\npart of that root contract.",
          )
          text = text.replace(
              "| `Mt5Config`                                     | Stable connection-configuration type re-exported by mt5cli so downstream applications do not import pdmt5 directly                                                                                                                                                               |\n",
              "",
          )
          text = text.replace(
              "| `build_config`                                  | Build `Mt5Config` from connection fields;",
              "| `build_config`                                  | Build the underlying MT5 connection config from connection fields;",
          )
          docs.write_text(text, encoding="utf-8")

          tests = Path("tests/unit/test_contracts.py")
          text = tests.read_text(encoding="utf-8")
          marker = '    [\n        "Mt5RuntimeError",\n'
          if marker in text and '    [\n        "Mt5Config",\n        "Mt5RuntimeError",\n' not in text:
              text = text.replace(marker, '    [\n        "Mt5Config",\n        "Mt5RuntimeError",\n', 1)
          tests.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/agent-remove-config-export-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep configuration type out of root SDK docs"
          git push origin "HEAD:${BRANCH}"
