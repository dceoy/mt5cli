name: Synchronize branch public contract

on:
  push:
    branches:
      - agent/cleanup-and-python-314

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Update public contract and re-run CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "${BRANCH}"
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/api/public-contract.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "every package-root symbol. Lower-level helpers (schema utilities, export\n"
              "functions, parser helpers, low-level MT5 wrappers) are available directly from\n"
              "their owning modules (`mt5cli.schemas`, `mt5cli.utils`, `mt5cli.converters`,\n"
              "`mt5cli.marketdata`, etc.) and are not part of the root SDK surface.",
              "every package-root symbol. Helpers promoted for downstream use, including\n"
              "configuration types, selected parsing utilities, history timeframe resolution,\n"
              "and Grafana schema setup, are part of that root contract. Other low-level\n"
              "schema, export, conversion, and implementation helpers remain available only\n"
              "from their owning modules.",
          )
          text = text.replace(
              "| `MT5Client`                                     | The single connected client for data, history, calculations, order checking, and order sending                                                                                                                                                                                    |\n"
              "| `build_config`                                  | Build `pdmt5.Mt5Config` from connection fields; `login` accepts `int \\| str \\| None` — numeric strings are coerced to `int`, blank strings are treated as unset, and `${ENV_VAR}` / `$ENV_NAME` placeholders in string parameters are expanded when `allow_whole_dollar_env=True` |",
              "| `MT5Client`                                     | The single connected client for data, history, calculations, order checking, and order sending                                                                                                                                                                                    |\n"
              "| `Mt5Config`                                     | Stable connection-configuration type re-exported by mt5cli so downstream applications do not import pdmt5 directly                                                                                                                                                               |\n"
              "| `build_config`                                  | Build `Mt5Config` from connection fields; `login` accepts `int \\| str \\| None` — numeric strings are coerced to `int`, blank strings are treated as unset, and `${ENV_VAR}` / `$ENV_NAME` placeholders in string parameters are expanded when `allow_whole_dollar_env=True`        |\n"
              "| `substitute_mapping_values`                     | Generic selected-key environment substitution for downstream configuration adapters                                                                                                                                                                                               |",
          )
          marker = "See [History Collection (SQLite)](history.md) for schema, view naming, and ER\ndiagrams.\n"
          addition = (
              marker
              + "\nShared package-root helpers used by downstream adapters include `Dataset`,\n"
              + "`parse_timeframe`, and `resolve_history_timeframes`. These are stable exports;\n"
              + "downstream applications should not import them from `mt5cli.utils` or\n"
              + "`mt5cli.history`.\n"
          )
          text = text.replace(marker, addition)
          text = text.replace(
              "Lower-level helpers (`ensure_grafana_schema`, `create_grafana_views`,\n"
              "`create_grafana_indexes`, `create_snapshot_tables`, `start_snapshot_run`,",
              "`ensure_grafana_schema` is a stable package-root helper for downstream setup.\n"
              "Other lower-level helpers (`create_grafana_views`, `create_grafana_indexes`,\n"
              "`create_snapshot_tables`, `start_snapshot_run`,",
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/agent-sync-public-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize stable SDK documentation"
            git push origin "HEAD:${BRANCH}"
          fi
          gh api --method POST "repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -f ref="${BRANCH}" -f 'inputs[workflow]=lint-and-test'
