name: Update branch contract test

on:
  push:
    branches:
      - agent/cleanup-and-python-314

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Remove Mt5Config from pass-through exclusions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "${BRANCH}"
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/unit/test_contracts.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('        "Mt5Config",\n', "")
          text = text.replace(
              '    """Downstream code must import pdmt5 types/constants directly from pdmt5.\n',
              '    """Low-level pdmt5 types/constants stay out of the stable package root.\n',
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/agent-update-contract-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update stable SDK contract test"
          git push origin "HEAD:${BRANCH}"
