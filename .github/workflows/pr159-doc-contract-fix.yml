name: Align PR 159 canonical rate docs

on:
  push:
    branches:
      - agent/fix-maintenance-issues

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-maintenance-issues
          fetch-depth: 0
      - name: Remove compatibility-view documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          start = text.index("- **`collect-history`**:")
          end = text.index("- **Multi-account latest rates**:", start)
          replacement = '''- **`collect-history`**: explicit date-range export into SQLite.
          - **`update_history`**: incremental append based on existing SQLite `MAX(time)` per symbol (and timeframe for rates); account-level deals use a separate cursor when `include_account_events=True`. Rates are persisted only in the canonical normalized `rates` table.
          - **`rates` table**: normalized storage with `symbol` and `timeframe` columns.
          - **Explicit table loading**: use `load_rate_data()` / `load_rate_data_from_connection()` for intentionally named custom SQLite rate tables.
          - **Multi-series rate loading**: use `build_rate_targets()` to build neutral `RateTarget(symbol, timeframe)` pairs and `load_rate_series_from_sqlite()` to load canonical `rates` rows into a mapping keyed by `(symbol, integer timeframe)`. Pass `explicit_tables` only for intentionally named custom tables; duplicate `(symbol, timeframe)` targets are rejected.
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"
          path.write_text(text[:start] + replacement + text[end:])

          path = Path("docs/api/history.md")
          text = path.read_text()
          start = text.index("### Rate data loading\n")
          end = text.index("\n## Throttled incremental history updates", start)
          replacement = '''### Rate data loading

          The canonical managed rate store is the normalized `rates` table. Stable
          symbol/timeframe reads query that table directly; mt5cli does not create,
          discover, resolve, or maintain per-series `rate_*` compatibility views.

          Use `load_rate_series_from_sqlite()` or
          `load_rate_series_by_granularity()` for canonical managed data:

          ```python
          from pathlib import Path

          from mt5cli import (
              build_rate_targets,
              load_rate_series_by_granularity,
              load_rate_series_from_sqlite,
          )

          path = Path("history.db")
          targets = build_rate_targets(["EURUSD", "GBPUSD"], ["M1", "H1"])
          series = load_rate_series_from_sqlite(path, targets, count=1000)
          eurusd_m1 = series["EURUSD", 1]

          by_name = load_rate_series_by_granularity(
              path,
              symbols=["EURUSD", "GBPUSD"],
              granularities=["M1", "H1"],
              count=500,
          )
          eurusd_m1_named = by_name["EURUSD", "M1"]
          ```

          Canonical reads apply `count` in SQLite and return the selected rows in
          chronological order. Each returned series uses an ascending `DatetimeIndex`
          named `time`. Timezone-naive MT5 trade-server wall-clock timestamps remain
          naive; explicitly timezone-aware timestamps preserve their instant and are
          normalized to UTC.

          `explicit_tables` and the single-table `table=` form are reserved for
          intentionally named custom tables. They do not discover or fall back to
          managed per-series views. Explicit table counts must match target counts, and
          duplicate `(symbol, timeframe)` targets are rejected.

          `load_rate_data()` / `load_rate_data_from_connection()` remain available for
          low-level explicit-table reads. These helpers validate that `time` exists and
          return an ascending `DatetimeIndex` named `time`.
          '''
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          ) + "\n"
          path.write_text(text[:start] + replacement + text[end:])

          path = Path("docs/index.md")
          text = path.read_text()
          text = text.replace(
              "- **SQLite rate loading**: Load mt5cli-managed rate tables/views for offline workflows",
              "- **SQLite rate loading**: Load canonical normalized `rates` series for offline workflows",
          )
          text = text.replace(
              "from mt5cli.history import load_rate_data, resolve_rate_view_name",
              "from mt5cli import build_rate_targets, load_rate_series_from_sqlite",
          )
          old = '''# Offline rate loading from mt5cli-managed SQLite history
          view = resolve_rate_view_name(Path("history.db"), "EURUSD", "M1", require_existing=True)
          offline_rates = load_rate_data(Path("history.db"), view, count=1000)
          '''
          old = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old.splitlines()
          ) + "\n"
          new = '''# Offline rate loading from canonical normalized SQLite history
          targets = build_rate_targets(["EURUSD"], ["M1"])
          offline_rates = load_rate_series_from_sqlite(
              Path("history.db"), targets, count=1000
          )["EURUSD", 1]
          '''
          new = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new.splitlines()
          ) + "\n"
          if old not in text:
              raise SystemExit("docs/index.md offline-rate example not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("docs/api/public-contract.md")
          text = path.read_text()
          text = text.replace(
              "SQLite-only one-row-per-gap report for a rate table or legacy view",
              "SQLite-only one-row-per-gap report for the canonical rates table or an explicit custom table",
          )
          text = text.replace(
              "See [History Collection (SQLite)](history.md) for schema, view naming, and ER\ndiagrams.",
              "See [History Collection (SQLite)](history.md) for the canonical schema, loading contract, and ER diagrams.",
          )
          path.write_text(text)

          stale = (
              "resolve_rate_view_name",
              "resolve_rate_view_names",
              "resolve_rate_tables",
              "Rate compatibility views",
              "mt5cli-managed rate tables/views",
          )
          for filename in (
              "README.md",
              "docs/api/history.md",
              "docs/api/public-contract.md",
              "docs/index.md",
          ):
              content = Path(filename).read_text()
              found = [token for token in stale if token in content]
              if found:
                  raise SystemExit(f"stale rate-view docs remain in {filename}: {found}")
          PY
      - name: Commit documentation cleanup
        shell: bash
        run: |
          rm .github/workflows/pr159-doc-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align canonical rate documentation"
          git push origin HEAD:agent/fix-maintenance-issues
