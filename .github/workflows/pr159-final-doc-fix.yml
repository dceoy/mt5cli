name: Finalize PR 159 canonical docs

on:
  push:
    branches:
      - agent/fix-maintenance-issues

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-maintenance-issues
          fetch-depth: 0
      - name: Fix canonical docs and formatting
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/index.md")
          text = path.read_text()
          text = text.replace(
              '''offline_rates = load_rate_series_from_sqlite(
              Path("history.db"), targets, count=1000
          )["EURUSD", 1]''',
              '''offline_rates = load_rate_series_from_sqlite(Path("history.db"), targets, count=1000)[
              "EURUSD", 1
          ]''',
          )
          text = text.replace(
              "Export a SQLite-only one-row-per-gap report from managed rate legacy views without connecting to MT5",
              "Export a SQLite-only one-row-per-gap report from the canonical `rates` table or an explicit custom table without connecting to MT5",
          )
          path.write_text(text)
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/pr159-final-doc-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize canonical rate documentation"
          git push origin HEAD:agent/fix-maintenance-issues
