name: Fix PR 159 public contract wording

on:
  push:
    branches:
      - agent/fix-maintenance-issues

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-maintenance-issues
          fetch-depth: 0
      - name: Fix public contract wording
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/api/public-contract.md")
          text = path.read_text()
          old = '''`history-gaps` reads an existing SQLite history database and exports one row
          per detected gap from managed rate legacy views. It never initializes
          MT5. Pass `--granularity-seconds` for custom tables or views whose bar spacing
          cannot be inferred from the name.'''
          new = '''`history-gaps` reads an existing SQLite history database and exports one row
          per detected gap from the canonical `rates` table or an explicitly named custom
          table. It never initializes MT5. Pass `--granularity-seconds` for custom tables
          whose bar spacing cannot be inferred from timeframe metadata.'''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          if old not in text:
              raise SystemExit("legacy history-gaps wording not found")
          path.write_text(text.replace(old, new, 1))
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/pr159-public-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove final legacy history-gaps wording"
          git push origin HEAD:agent/fix-maintenance-issues
