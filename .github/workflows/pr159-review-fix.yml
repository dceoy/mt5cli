          history_doc = history_doc.replace("table or view", "table")
          history_doc = history_doc.replace("tables or views", "tables")
          write("docs/api/history.md", history_doc)

          for doc_path in ("docs/api/public-contract.md", "docs/index.md"):
              doc = read(doc_path)
              doc = doc.replace("compatibility views", "legacy views")
              doc = doc.replace("compatibility view", "legacy view")
              write(doc_path, doc)

          # Drop stale compatibility imports that may remain after test removal.
          for path in (history_test, cli_test, rates_test):
              text = read(path)
              text = re.sub(r"^from typing import TYPE_CHECKING, cast\n", "from typing import TYPE_CHECKING, cast\n", text, flags=re.MULTILINE)
              write(path, text)

          # Parse every changed Python file before committing.
          for path in (
