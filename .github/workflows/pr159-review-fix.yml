name: Apply PR 159 review fixes

on:
  push:
    branches:
      - agent/fix-maintenance-issues

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-maintenance-issues
          fetch-depth: 0
      - name: Apply focused review fixes
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path
          from textwrap import dedent

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text)

          def node_start(node: ast.AST) -> int:
              lines = [node.lineno]
              lines.extend(d.lineno for d in getattr(node, "decorator_list", []))
              return min(lines) - 1

          def replace_top_def(path: str, name: str, replacement: str) -> None:
              text = read(path)
              tree = ast.parse(text)
              node = next(
                  n
                  for n in tree.body
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
                  and n.name == name
              )
              lines = text.splitlines(keepends=True)
              lines[node_start(node):node.end_lineno] = [dedent(replacement).strip("\n") + "\n\n"]
              write(path, "".join(lines))

          def remove_top_defs(path: str, names: set[str]) -> None:
              text = read(path)
              tree = ast.parse(text)
              ranges: list[tuple[int, int]] = []
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name in names:
                      ranges.append((node_start(node), node.end_lineno))
              lines = text.splitlines(keepends=True)
              for start, end in sorted(ranges, reverse=True):
                  del lines[start:end]
              write(path, "".join(lines))

          def remove_top_if_containing(path: str, needle: str) -> None:
              text = read(path)
              tree = ast.parse(text)
              lines = text.splitlines(keepends=True)
              ranges: list[tuple[int, int]] = []
              for node in tree.body:
                  if isinstance(node, ast.If):
                      segment = ast.get_source_segment(text, node) or ""
                      if needle in segment:
                          ranges.append((node.lineno - 1, node.end_lineno))
              for start, end in sorted(ranges, reverse=True):
                  del lines[start:end]
              write(path, "".join(lines))

          def remove_assignment(path: str, name: str) -> None:
              text = read(path)
              tree = ast.parse(text)
              lines = text.splitlines(keepends=True)
              ranges = []
              for node in tree.body:
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      if any(isinstance(t, ast.Name) and t.id == name for t in targets):
                          ranges.append((node.lineno - 1, node.end_lineno))
              for start, end in sorted(ranges, reverse=True):
                  del lines[start:end]
              write(path, "".join(lines))

          def remove_test_functions_containing(path: str, tokens: tuple[str, ...]) -> None:
              text = read(path)
              tree = ast.parse(text)
              ranges: list[tuple[int, int]] = []
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      continue
                  segment = ast.get_source_segment(text, node) or ""
                  if any(token in segment for token in tokens):
                      ranges.append((node_start(node), node.end_lineno))
              # Drop nested/overlapping ranges safely.
              merged: list[tuple[int, int]] = []
              for start, end in sorted(ranges):
                  if merged and start < merged[-1][1]:
                      merged[-1] = (merged[-1][0], max(merged[-1][1], end))
                  else:
                      merged.append((start, end))
              lines = text.splitlines(keepends=True)
              for start, end in reversed(merged):
                  del lines[start:end]
              write(path, "".join(lines))

          history_path = "mt5cli/history.py"
          remove_top_defs(
              history_path,
              {
                  "infer_rate_table_granularity_seconds",
                  "build_rate_view_name",
                  "_open_history_connection",
                  "_load_rates_timeframe_counts",
                  "_load_existing_rate_views",
                  "_rate_view_name_candidates",
                  "_resolve_rate_view_name_from_context",
                  "resolve_rate_view_name",
                  "resolve_rate_view_names",
                  "resolve_rate_tables",
                  "load_rate_series_from_sqlite",
                  "load_rate_series_by_granularity",
                  "drop_rate_compatibility_views",
                  "create_rate_compatibility_views",
              },
          )
          remove_top_if_containing(history_path, "def load_rate_series_from_sqlite")
          remove_assignment(history_path, "_RATE_VIEW_NAME_RE")

          text = read(history_path)
          text = text.replace("import re\n", "")
          text = text.replace(", overload\n", "\n")
          text = text.replace(
              '_SQLITE_CANONICAL_TIME_FORMAT = "%Y-%m-%dT%H:%M:%f+00:00"',
              '_SQLITE_CANONICAL_TIME_FORMAT = "%Y-%m-%dT%H:%M:%f"',
          )
          text = text.replace(
              "    create_rate_views: bool,\n",
              "",
          )
          text = text.replace(
              "    create_rate_views: bool = True,\n",
              "",
          )
          text = text.replace(
              "        create_rate_views=create_rate_views,\n",
              "",
          )
          text = text.replace(
              "        create_rate_views: Create ``rate_<symbol>__<timeframe>`` views.\n",
              "",
          )
          text = text.replace(
              "    if create_rate_views and Dataset.rates in written_tables:\n        create_rate_compatibility_views(conn)\n",
              "",
          )
          write(history_path, text)

          replace_top_def(
              history_path,
              "resolve_rate_table_name",
              '''
              def resolve_rate_table_name(symbol: str, granularity: str) -> str:
                  """Return the canonical normalized SQLite rate table name.

                  Returns:
                      Canonical normalized rates table name.

                  Raises:
                      ValueError: If ``symbol`` or ``granularity`` is invalid.
                  """
                  parse_timeframe(granularity)
                  if not symbol.strip():
                      msg = "symbol must not be empty."
                      raise ValueError(msg)
                  return Dataset.rates.table_name
              ''',
          )

          replace_top_def(
              history_path,
              "_rate_gap_metadata",
              '''
              def _rate_gap_metadata(table: str, frame: pd.DataFrame) -> dict[str, object]:
                  """Return canonical series metadata from rate-table columns."""
                  symbol: str | None = None
                  timeframe: int | None = None
                  granularity: str | None = None

                  if "symbol" in frame.columns:
                      symbols = {str(value) for value in frame["symbol"].dropna().unique()}
                      if len(symbols) == 1:
                          symbol = next(iter(symbols))
                  if "timeframe" in frame.columns:
                      timeframes = {
                          coerced
                          for value in frame["timeframe"].dropna().unique()
                          if (coerced := _coerce_optional_int(value)) is not None
                      }
                      if len(timeframes) == 1:
                          timeframe = next(iter(timeframes))
                  if timeframe is not None:
                      granularity = resolve_granularity_name(timeframe)

                  return {
                      "table": table,
                      "symbol": symbol,
                      "timeframe": timeframe,
                      "granularity": granularity,
                  }
              ''',
          )

          replace_top_def(
              history_path,
              "report_rate_gaps",
              '''
              def report_rate_gaps(
                  conn: sqlite3.Connection,
                  table: str,
                  *,
                  granularity_seconds: int | None = None,
                  min_gap_intervals: int = 1,
              ) -> pd.DataFrame:
                  """Return one row per detected gap from a SQLite rate table.

                  The canonical ``rates`` table infers each series interval from its
                  ``timeframe`` column. Custom tables without timeframe metadata must
                  provide ``granularity_seconds`` explicitly.

                  Raises:
                      ValueError: If the table/schema/timestamps or gap parameters are invalid.
                  """
                  table_name = _validate_rate_load_request(table, count=None)
                  if granularity_seconds is not None and granularity_seconds <= 0:
                      msg = "granularity_seconds must be positive."
                      raise ValueError(msg)
                  if min_gap_intervals <= 0:
                      msg = "min_gap_intervals must be positive."
                      raise ValueError(msg)

                  columns = get_table_columns(conn, table_name)
                  _ensure_rate_columns(columns, table_name)
                  quoted_table = quote_sqlite_identifier(table_name)
                  frame = cast(
                      "pd.DataFrame",
                      pd.read_sql_query(  # type: ignore[reportUnknownMemberType]
                          f"SELECT * FROM {quoted_table} ORDER BY time ASC",  # noqa: S608
                          conn,
                      ),
                  )
                  if frame.empty:
                      return _empty_rate_gap_report()

                  parsed_times = frame["time"].map(parse_sqlite_timestamp)
                  if parsed_times.isna().any():
                      msg = f"SQLite table {table_name!r} contains unparsable time values."
                      raise ValueError(msg)

                  series_frame = frame.copy()
                  series_frame["time"] = parsed_times
                  rows: list[dict[str, object]] = []
                  for group in _iter_rate_gap_groups(series_frame):
                      metadata = _rate_gap_metadata(table_name, group)
                      interval_seconds = granularity_seconds
                      if interval_seconds is None:
                          timeframe = metadata["timeframe"]
                          if not isinstance(timeframe, int):
                              msg = (
                                  f"Could not infer granularity for {table_name!r}; "
                                  "pass granularity_seconds for a custom table."
                              )
                              raise ValueError(msg)
                          interval_seconds = timeframe_interval_seconds(timeframe)
                          if interval_seconds is None:
                              msg = f"Unsupported rate timeframe: {timeframe}."
                              raise ValueError(msg)

                      unique_times = group["time"].drop_duplicates()
                      sort_keys = pd.to_datetime(
                          unique_times,
                          errors="coerce",
                          format="mixed",
                          utc=True,
                      )
                      order = sort_keys.argsort()
                      ordered_times = unique_times.iloc[order].reset_index(drop=True)
                      ordered_keys = pd.Series(sort_keys.iloc[order]).reset_index(drop=True)
                      if len(ordered_times) < _MIN_TIMESTAMPS_FOR_GAPS:
                          continue
                      deltas = ordered_keys.diff().dropna()
                      for index, delta in enumerate(deltas, start=1):
                          delta_seconds = int(delta.total_seconds())
                          missing_intervals = max(
                              ((delta_seconds + (interval_seconds - 1)) // interval_seconds)
                              - 1,
                              0,
                          )
                          if missing_intervals < min_gap_intervals:
                              continue
                          previous_time = ordered_times.iloc[index - 1]
                          next_time = ordered_times.iloc[index]
                          rows.append({
                              **metadata,
                              "granularity_seconds": interval_seconds,
                              "gap_start": previous_time + timedelta(seconds=interval_seconds),
                              "gap_end": next_time - timedelta(seconds=interval_seconds),
                              "missing_intervals": missing_intervals,
                          })
                  return pd.DataFrame(rows, columns=_RATE_GAP_COLUMNS)
              ''',
          )

          replace_top_def(
              history_path,
              "_parse_string_sqlite_timestamp",
              '''
              def _parse_string_sqlite_timestamp(value: str) -> datetime | None:
                  """Parse a stored timestamp without assigning a missing timezone."""
                  parsed = pd.to_datetime(value, errors="coerce", format="mixed")
                  if pd.isna(parsed):
                      logger.warning("Ignoring unparseable history timestamp: %s", value)
                      return None
                  timestamp = cast("pd.Timestamp", parsed)
                  result = timestamp.to_pydatetime()
                  if result.tzinfo is not None:
                      return result.astimezone(UTC)
                  return result
              ''',
          )

          replace_top_def(
              history_path,
              "parse_sqlite_timestamp",
              '''
              def parse_sqlite_timestamp(value: object) -> datetime | None:
                  """Parse a SQLite history timestamp without inventing a timezone.

                  Naive values remain MT5 trade-server wall-clock labels. Explicitly
                  aware values are normalized to UTC while preserving their instant.
                  Numeric epoch values follow pdmt5's naive wall-clock representation.
                  """
                  if value is None:
                      return None
                  if isinstance(value, datetime):
                      return value.astimezone(UTC) if value.tzinfo is not None else value
                  if isinstance(value, int | float):
                      parsed = pd.to_datetime(value, unit="s", errors="coerce")
                      if pd.isna(parsed):
                          return None
                      return cast("pd.Timestamp", parsed).to_pydatetime()
                  if isinstance(value, str):
                      return _parse_string_sqlite_timestamp(value)
                  logger.warning("Ignoring unsupported history timestamp type: %s", type(value))
                  return None
              ''',
          )

          replace_top_def(
              history_path,
              "_serialize_sqlite_timestamp",
              '''
              def _serialize_sqlite_timestamp(value: object) -> str | None:
                  """Serialize without relabeling naive MT5 wall-clock timestamps."""
                  parsed = parse_sqlite_timestamp(value)
                  if parsed is None:
                      return None
                  normalized = parsed.astimezone(UTC) if parsed.tzinfo is not None else parsed
                  timespec = "microseconds" if normalized.microsecond else "seconds"
                  return normalized.isoformat(timespec=timespec)
              ''',
          )

          replace_top_def(
              history_path,
              "_require_serialized_sqlite_timestamp",
              '''
              def _require_serialized_sqlite_timestamp(value: object) -> str:
                  """Return a timezone-neutral SQLite comparison key for a timestamp."""
                  parsed = parse_sqlite_timestamp(value)
                  if parsed is None:
                      msg = f"Invalid SQLite timestamp boundary: {value!r}"
                      raise ValueError(msg)
                  if parsed.tzinfo is not None:
                      parsed = parsed.astimezone(UTC).replace(tzinfo=None)
                  timespec = "microseconds" if parsed.microsecond else "seconds"
                  return parsed.isoformat(timespec=timespec)
              ''',
          )

          replace_top_def(
              history_path,
              "_sqlite_normalized_time_expression",
              '''
              def _sqlite_normalized_time_expression(column: str) -> str:
                  """Return a sortable clock expression without assigning a timezone."""
                  quoted = quote_sqlite_identifier(column)
                  return (
                      "COALESCE("
                      f"strftime('{_SQLITE_CANONICAL_TIME_FORMAT}', {quoted}), "
                      f"strftime('{_SQLITE_CANONICAL_TIME_FORMAT}', {quoted}, 'unixepoch')"
                      ")"
                  )
              ''',
          )

          replace_top_def(
              history_path,
              "_load_grouped_rate_start_datetimes",
              '''
              def _load_grouped_rate_start_datetimes(
                  conn: sqlite3.Connection,
                  table: str,
                  *,
                  symbols: Sequence[str],
                  timeframes: Sequence[int],
                  fallback_start: datetime,
              ) -> dict[tuple[str, int | None], datetime]:
                  """Load per-series cursors while preserving raw timestamp semantics."""
                  result: dict[tuple[str, int | None], datetime] = {}
                  for symbol in symbols:
                      for timeframe in timeframes:
                          parsed = _load_latest_parseable_time(
                              conn,
                              table,
                              where_clause="symbol = ? AND timeframe = ?",
                              params=(symbol, timeframe),
                          )
                          result[symbol, timeframe] = (
                              parsed if parsed is not None else fallback_start
                          )
                  return result
              ''',
          )

          replace_top_def(
              history_path,
              "_load_symbol_start_datetimes",
              '''
              def _load_symbol_start_datetimes(
                  conn: sqlite3.Connection,
                  table: str,
                  *,
                  symbols: Sequence[str],
                  fallback_start: datetime,
              ) -> dict[tuple[str, int | None], datetime]:
                  """Load per-symbol cursors while preserving raw timestamp semantics."""
                  result: dict[tuple[str, int | None], datetime] = {}
                  for symbol in symbols:
                      parsed = _load_latest_parseable_time(
                          conn,
                          table,
                          where_clause="symbol = ?",
                          params=(symbol,),
                      )
                      result[symbol, None] = parsed if parsed is not None else fallback_start
                  return result
              ''',
          )

          # Canonical rate module: direct normalized-table reads and generic explicit tables.
          rates_path = "mt5cli/rates.py"
          text = read(rates_path)
          text = text.replace("from contextlib import closing\n", "")
          text = text.replace(
              "from .history import (\n    RateTarget,\n    drop_rate_compatibility_views,\n    resolve_granularity_name,\n)\n",
              "from .history import RateTarget, load_rate_data, resolve_granularity_name\n",
          )
          text = re.sub(
              r"from \.history import \(\n    load_rate_series_from_sqlite as _legacy_load_rate_series_from_sqlite,\n\)\n",
              "",
              text,
          )
          text = text.replace(
              "    _mt5_time_sort_key,  # type: ignore[reportPrivateUsage]\n",
              "",
          )
          write(rates_path, text)
          remove_top_defs(rates_path, {"_remove_rate_compatibility_views"})

          replace_top_def(
              rates_path,
              "_load_canonical_rate_target",
              '''
              def _load_canonical_rate_target(
                  conn: sqlite3.Connection,
                  target: RateTarget,
                  *,
                  count: int,
              ) -> pd.DataFrame:
                  """Load one rate series from canonical normalized storage."""
                  if target.symbol is None:
                      msg = "A symbol is required for canonical normalized rate loading."
                      raise ValueError(msg)
                  time_expr = (
                      "COALESCE(strftime('%Y-%m-%dT%H:%M:%f', time), "
                      "strftime('%Y-%m-%dT%H:%M:%f', time, 'unixepoch'))"
                  )
                  frame = pd.read_sql_query(  # type: ignore[reportUnknownMemberType]
                      "SELECT * FROM rates WHERE symbol = ? AND timeframe = ? "
                      f"ORDER BY {time_expr} DESC, ROWID DESC LIMIT ?",
                      conn,
                      params=(target.symbol, target.timeframe_int, count),
                  )
                  if "time" not in frame.columns:
                      msg = "The canonical rates table is missing the required time column."
                      raise ValueError(msg)
                  if frame.empty:
                      result = frame.drop(columns=["time"])
                      result.index = pd.DatetimeIndex([], name="time")
                      return result

                  frame = normalize_time_columns(frame, DataKind.rates)
                  awareness = [
                      isinstance(value, pd.Timestamp) and value.tzinfo is not None
                      for value in frame["time"]
                  ]
                  if any(awareness) and not all(awareness):
                      msg = (
                          "A canonical rate series cannot mix timezone-naive MT5 wall-clock "
                          "timestamps with timezone-aware instants."
                      )
                      raise ValueError(msg)
                  result = frame.drop(columns=["time"])
                  result.index = pd.DatetimeIndex(frame["time"], name="time")
                  return result.sort_index(kind="stable")
              ''',
          )

          replace_top_def(
              rates_path,
              "_load_rate_series_through_legacy",
              '''
              def _load_explicit_rate_series(
                  conn_or_path: SqliteConnOrPath,
                  targets: Sequence[RateTarget] | None,
                  count: int | None,
                  explicit_tables: Sequence[str] | None,
                  *,
                  table: str | None,
              ) -> dict[tuple[str | None, int], pd.DataFrame] | pd.DataFrame:
                  """Load intentionally named custom tables without managed-view discovery."""
                  if table is not None:
                      return load_rate_data(conn_or_path, table, count=count)
                  if targets is None:
                      msg = "targets are required when explicit_tables is provided."
                      raise ValueError(msg)
                  if count is None or count <= 0:
                      msg = "count must be positive."
                      raise ValueError(msg)
                  target_list = list(targets)
                  tables = list(explicit_tables or ())
                  if len(tables) != len(target_list):
                      msg = (
                          f"Expected {len(target_list)} explicit table(s) to match the "
                          f"targets, got {len(tables)}."
                      )
                      raise ValueError(msg)
                  keys = [(target.symbol, target.timeframe_int) for target in target_list]
                  if len(set(keys)) != len(keys):
                      msg = "Duplicate rate targets are not allowed."
                      raise ValueError(msg)
                  return {
                      key: load_rate_data(conn_or_path, table_name, count=count)
                      for key, table_name in zip(keys, tables, strict=True)
                  }
              ''',
          )

          text = read(rates_path).replace(
              "_load_rate_series_through_legacy(",
              "_load_explicit_rate_series(",
          )
          text = text.replace(
              "    _remove_rate_compatibility_views(output)\n",
              "",
          )
          text = text.replace(
              "        create_rate_views=False,\n",
              "",
          )
          write(rates_path, text)

          # Canonical history-gaps CLI defaults to the normalized rates table.
          cli_path = "mt5cli/cli.py"
          text = read(cli_path)
          text = text.replace(
              "from .history import (\n    infer_rate_table_granularity_seconds,\n    open_existing_sqlite_database,\n    report_rate_gaps,\n)\n",
              "from .history import open_existing_sqlite_database, report_rate_gaps\n",
          )
          write(cli_path, text)
          remove_top_defs(cli_path, {"_default_gap_tables"})
          replace_top_def(
              cli_path,
              "history_gaps",
              '''
              @app.command("history-gaps", rich_help_panel="Collection")
              def history_gaps(
                  ctx: typer.Context,
                  sqlite3_path: Annotated[
                      Path,
                      typer.Option(
                          "--sqlite3",
                          help="Source SQLite history database to analyze.",
                      ),
                  ],
                  table: Annotated[
                      list[str] | None,
                      typer.Option(
                          "--table",
                          help=(
                              "Rate table to inspect (repeat for multiple); defaults to "
                              "the canonical rates table."
                          ),
                      ),
                  ] = None,
                  granularity_seconds: Annotated[
                      int | None,
                      typer.Option(
                          help=(
                              "Explicit bar interval in seconds for custom tables without "
                              "timeframe metadata."
                          ),
                      ),
                  ] = None,
                  min_gap_intervals: Annotated[
                      int,
                      typer.Option(help="Minimum missing-bar count required to emit a gap row."),
                  ] = 1,
              ) -> None:
                  """Export SQLite rate gaps without connecting to MT5."""
                  try:
                      conn, _ = open_existing_sqlite_database(sqlite3_path)
                  except ValueError as exc:
                      raise typer.BadParameter(str(exc), param_hint="--sqlite3") from exc
                  with closing(conn):
                      tables = list(table) if table else [Dataset.rates.table_name]
                      frames: list[pd.DataFrame] = []
                      for table_name in tables:
                          try:
                              frames.append(
                                  report_rate_gaps(
                                      conn,
                                      table_name,
                                      granularity_seconds=granularity_seconds,
                                      min_gap_intervals=min_gap_intervals,
                                  )
                              )
                          except ValueError as exc:
                              raise typer.BadParameter(
                                  str(exc),
                                  param_hint="--granularity-seconds",
                              ) from exc
                  df = (
                      pd.concat(frames, ignore_index=True)
                      if frames
                      else pd.DataFrame(columns=["table"])
                  )
                  _execute_export(ctx, lambda: df)
              ''',
          )

          # Delete compatibility-specific history tests rather than retaining shims.
          history_test = "tests/unit/test_history.py"
          remove_test_functions_containing(
              history_test,
              (
                  "resolve_rate_view_name",
                  "resolve_rate_view_names",
                  "resolve_rate_tables",
                  "build_rate_view_name",
                  "create_rate_compatibility_views",
                  "drop_rate_compatibility_views",
                  "load_rate_series_from_sqlite",
                  "load_rate_series_by_granularity",
                  "create_rate_views",
                  "rate_EURUSD__",
              ),
          )
          text = read(history_test)
          for name in (
              "build_rate_view_name",
              "create_rate_compatibility_views",
              "drop_rate_compatibility_views",
              "load_rate_series_by_granularity",
              "load_rate_series_from_sqlite",
              "resolve_rate_tables",
              "resolve_rate_view_name",
              "resolve_rate_view_names",
          ):
              text = re.sub(rf"^    {name},\n", "", text, flags=re.MULTILINE)
          write(history_test, text)

          # Add SQLite wall-clock regression coverage.
          with Path(history_test).open("a") as handle:
              handle.write(dedent('''

              def test_sqlite_round_trip_preserves_naive_server_wall_clock() -> None:
                  """SQLite storage must not relabel a naive server timestamp as UTC."""
                  wall_clock = datetime(2024, 1, 1, 9, 30)
                  frame = pd.DataFrame({"time": [wall_clock], "close": [1.0]})
                  with sqlite3.connect(":memory:") as conn:
                      assert append_dataframe(conn, frame, "rates", IfExists.APPEND)
                      stored = conn.execute("SELECT time FROM rates").fetchone()[0]
                  assert stored == "2024-01-01T09:30:00"
                  parsed = parse_sqlite_timestamp(stored)
                  assert parsed == wall_clock
                  assert parsed is not None and parsed.tzinfo is None


              def test_sqlite_round_trip_normalizes_explicit_offset_to_utc() -> None:
                  """Aware values preserve their instant while storage normalizes to UTC."""
                  aware = pd.Timestamp("2024-01-01T09:30:00+09:00").to_pydatetime()
                  frame = pd.DataFrame({"time": [aware], "close": [1.0]})
                  with sqlite3.connect(":memory:") as conn:
                      assert append_dataframe(conn, frame, "rates", IfExists.APPEND)
                      stored = conn.execute("SELECT time FROM rates").fetchone()[0]
                  assert stored == "2024-01-01T00:30:00+00:00"
                  assert parse_sqlite_timestamp(stored) == datetime(2024, 1, 1, 0, 30, tzinfo=UTC)


              def test_incremental_rate_cursor_preserves_naive_wall_clock() -> None:
                  """Incremental cursors return the stored naive server clock label unchanged."""
                  fallback = datetime(2023, 12, 31, tzinfo=UTC)
                  with sqlite3.connect(":memory:") as conn:
                      conn.execute(
                          "CREATE TABLE rates(symbol TEXT, timeframe INTEGER, time TEXT, close REAL)"
                      )
                      conn.execute(
                          "INSERT INTO rates VALUES (?, ?, ?, ?)",
                          ("EURUSD", 1, "2024-01-01T09:30:00", 1.0),
                      )
                      starts = load_incremental_start_datetimes(
                          conn,
                          Dataset.rates,
                          symbols=["EURUSD"],
                          timeframes=[1],
                          fallback_start=fallback,
                      )
                  cursor = starts["EURUSD", 1]
                  assert cursor == datetime(2024, 1, 1, 9, 30)
                  assert cursor.tzinfo is None
              '''))

          # Update canonical-rate tests for DatetimeIndex and remove cleanup/legacy-mock tests.
          rates_test = "tests/unit/test_rates.py"
          remove_test_functions_containing(
              rates_test,
              (
                  "_legacy_load_rate_series_from_sqlite",
                  "rate_EURUSD__",
                  "create_rate_views",
                  "test_canonical_loader_sorts_mixed_timezone_rows",
              ),
          )
          with Path(rates_test).open("a") as handle:
              handle.write(dedent('''

              def test_canonical_loader_returns_naive_datetime_index(tmp_path: Path) -> None:
                  """Canonical naive server-clock series keep a DatetimeIndex without a zone."""
                  db_path = tmp_path / "naive-index.db"
                  _create_canonical_database(
                      db_path,
                      [
                          ("EURUSD", 1, "2024-01-01T00:01:00", 1.1),
                          ("EURUSD", 1, "2024-01-01T00:00:00", 1.0),
                      ],
                  )
                  frame = rates.load_rate_series_from_sqlite(
                      db_path,
                      [RateTarget("EURUSD", 1)],
                      count=2,
                  )["EURUSD", 1]
                  assert isinstance(frame.index, pd.DatetimeIndex)
                  assert frame.index.name == "time"
                  assert frame.index.tz is None
                  assert list(frame["close"]) == [1.0, 1.1]


              def test_canonical_loader_normalizes_aware_index_to_utc(tmp_path: Path) -> None:
                  """Canonical aware instants are represented by a UTC DatetimeIndex."""
                  db_path = tmp_path / "aware-index.db"
                  _create_canonical_database(
                      db_path,
                      [
                          ("EURUSD", 1, "2024-01-01T09:00:00+09:00", 1.0),
                          ("EURUSD", 1, "2024-01-01T00:01:00+00:00", 1.1),
                      ],
                  )
                  frame = rates.load_rate_series_from_sqlite(
                      db_path,
                      [RateTarget("EURUSD", 1)],
                      count=2,
                  )["EURUSD", 1]
                  assert isinstance(frame.index, pd.DatetimeIndex)
                  assert str(frame.index.tz) == "UTC"
                  assert list(frame["close"]) == [1.0, 1.1]


              def test_canonical_loader_applies_limit_in_sqlite(tmp_path: Path) -> None:
                  """Canonical loading bounds rows in SQLite before pandas materialization."""
                  db_path = tmp_path / "limited.db"
                  _create_canonical_database(
                      db_path,
                      [
                          ("EURUSD", 1, f"2024-01-01T00:{minute:02d}:00", float(minute))
                          for minute in range(10)
                      ],
                  )
                  statements: list[str] = []
                  with sqlite3.connect(db_path) as conn:
                      conn.set_trace_callback(statements.append)
                      frame = rates.load_rate_series_from_sqlite(
                          conn,
                          [RateTarget("EURUSD", 1)],
                          count=2,
                      )["EURUSD", 1]
                  assert list(frame["close"]) == [8.0, 9.0]
                  assert any("LIMIT 2" in statement for statement in statements)
              '''))

          # Remove compatibility-oriented CLI tests; canonical behavior is covered by integration/QA.
          cli_test = "tests/unit/test_cli.py"
          remove_test_functions_containing(
