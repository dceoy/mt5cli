              (
                  "_default_gap_tables",
                  "rate_EURUSD__",
                  "compatibility view",
                  "infer_rate_table_granularity_seconds",
              ),
          )

          # Documentation: one canonical rate schema, no managed-view lifecycle contract.
          readme = read("README.md")
          readme = re.sub(r"^- \*\*Rate compatibility views:\*\*.*\n", "", readme, flags=re.MULTILINE)
          readme = re.sub(r"^- \*\*Rate view resolution:\*\*.*\n", "", readme, flags=re.MULTILINE)
          write("README.md", readme)

          history_doc = read("docs/api/history.md")
          history_doc = re.sub(
