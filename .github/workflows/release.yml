---
name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-release-${{ github.repository }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euo pipefail {0}
    working-directory: .
jobs:
  plan:
    if: >-
      github.repository == 'dceoy/mt5cli'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release-tag: ${{ steps.plan.outputs.tag }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
    steps:
      - name: Check out validated source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan release from pyproject.toml
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" || "${GITHUB_SHA}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::Workflow SHA differs from the validated source; skipping.'
            exit 0
          fi
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${main_sha}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::main advanced since validation; skipping stale release.'
            exit 0
          fi
          ci_runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${SOURCE_SHA}" --event push --branch main --status success --json databaseId --jq 'length')"
          if [[ "${ci_runs}" == 0 ]]; then
            echo "::error::No successful CI/CD push run found for ${SOURCE_SHA}."
            exit 1
          fi
          version="$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::project.version must be MAJOR.MINOR.PATCH.'
            exit 1
          fi
          tag="v${version}"
          if git rev-parse --verify -q "refs/tags/${tag}^{commit}" > /dev/null; then
            tagged_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if gh release view "${tag}" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
              if [[ "$(cat /tmp/release-draft)" == false ]]; then
                echo "::notice::${tag} is already published; skipping."
                exit 0
              fi
            fi
            if [[ "${tagged_sha}" != "${SOURCE_SHA}" ]]; then
              echo "::error::${tag} already points to another commit."
              exit 1
            fi
          fi
          latest="$(gh release list --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ -n "${latest}" ]]; then
            if [[ ! "${latest}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Latest release tag is not stable SemVer: ${latest}"
              exit 1
            fi
            if ! python3 - "${version}" "${latest#v}" <<'PY'
          import sys
          current, previous = (tuple(map(int, s.split("."))) for s in sys.argv[1:])
          sys.exit(0 if current > previous else 1)
          PY
            then
              echo "::error::project.version must exceed the latest release (${latest})."
              exit 1
            fi
          fi
          {
            echo "tag=${tag}"
            echo "source-sha=${SOURCE_SHA}"
          } >> "${GITHUB_OUTPUT}"
  build:
    needs: plan
    if: needs.plan.outputs.release-tag != ''
    # Nested jobs declare these permissions even when their publish flags are false.
    permissions:
      contents: write
      id-token: write
    uses: dceoy/gha-for-devops/.github/workflows/python-package-release-on-pypi-and-github.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      package-path: .
      create-github-release: false
      publish-to-pypi: false
  verify-source:
    needs:
      - plan
      - build
    if: needs.plan.outputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.verify.outputs.current }}
    steps:
      - name: Recheck that main still matches the validated source
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
        run: |
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ -z "${SOURCE_SHA}" || "${main_sha}" != "${SOURCE_SHA}" ]]; then
            echo '::notice::main advanced during the build; skipping stale release.'
            echo 'current=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # The release helper accepts an existing tag without checking its commit.
          # The last ls-remote line is the peeled commit for annotated tags.
          tagged_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" | awk 'END {print $1}')"
          if [[ -n "${tagged_sha}" && "${tagged_sha}" != "${SOURCE_SHA}" ]]; then
            echo "::error::${RELEASE_TAG} points to ${tagged_sha}, not the validated source ${SOURCE_SHA}."
            exit 1
          fi
          echo 'current=true' >> "${GITHUB_OUTPUT}"
  draft-release:
    needs:
      - plan
      - build
      - verify-source
    if: needs.verify-source.outputs.current == 'true'
    permissions:
      contents: write
    uses: dceoy/gha-for-devops/.github/workflows/github-release.yml@9e394d7c18b3a00fb853cd3c693cc4eeb5f0c825  # v2.3.0
    with:
      tag-name: ${{ needs.plan.outputs.release-tag }}
      create-new-tag: true
      draft: true
  attach-assets:
    needs:
      - build
      - draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.build.outputs.distribution-artifact-name }}
          path: dist/
      - name: Check distribution version
        env:
          RELEASE_TAG: ${{ needs.draft-release.outputs.release-tag }}
        run: |
          version="${RELEASE_TAG#v}"
          test -f "dist/mt5cli-${version}.tar.gz"
          shopt -s nullglob
          wheels=(dist/mt5cli-"${version}"-*.whl)
          if ((${#wheels[@]} == 0)); then
            echo "::error::No wheel found for ${RELEASE_TAG}."
            exit 1
          fi
      - name: Sign wheels with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.whl
      - name: Attach distributions and signatures
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.release-tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
  publish-to-pypi:
    needs:
      - build
      - attach-assets
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mt5cli
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.build.outputs.distribution-artifact-name }}
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          verbose: true
  # Recovery: if publish-to-pypi succeeded but this job failed, a rerun fails closed at
  # PyPI (duplicate version) and re-uploads draft assets via `--clobber`. Do not publish
  # the draft by hand until the wheel/sdist filenames and SHA-256 digests in
  # https://pypi.org/pypi/mt5cli/<version>/json match the draft's assets; then run
  # `gh release edit v<version> --draft=false`.
  publish-release:
    needs:
      - draft-release
      - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.draft-release.outputs.release-tag }}
        run: |
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
