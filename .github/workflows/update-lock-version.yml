---
name: Update lockfile version
on:
  push:
    branches:
      - perf/history-cursor-indexes
    paths:
      - .github/workflows/update-lock-version.yml
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update local package version in lockfile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("uv.lock")
          text = path.read_text(encoding="utf-8")
          old = 'name = "mt5cli"\nversion = "1.5.0"\nsource = { editable = "." }'
          new = 'name = "mt5cli"\nversion = "1.5.1"\nsource = { editable = "." }'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one mt5cli 1.5.0 package block")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          test "$(git diff --numstat -- uv.lock)" = $'1\t1\tuv.lock'
          git diff --unified=0 -- uv.lock | grep -F -- '-version = "1.5.0"'
          git diff --unified=0 -- uv.lock | grep -F -- '+version = "1.5.1"'
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'Update lockfile for 1.5.1'
          git push origin HEAD:perf/history-cursor-indexes
