---
name: Update lockfile version
on:
  push:
    branches:
      - perf/history-cursor-indexes
    paths:
      - .github/workflows/update-lock-version.yml
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update local package version in lockfile
        run: |
          python3 -m pip install --disable-pip-version-check uv
          uv lock --offline
          test "$(git diff --numstat -- uv.lock)" = "1	1	uv.lock"
          git diff --unified=0 -- uv.lock | grep -F -- '-version = "1.5.0"'
          git diff --unified=0 -- uv.lock | grep -F -- '+version = "1.5.1"'
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'Update lockfile for 1.5.1'
          git push origin HEAD:perf/history-cursor-indexes
