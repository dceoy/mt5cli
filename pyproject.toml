[project]
name = "mt5cli"
version = "1.7.0"
description = "Generic MT5 data and execution infrastructure for Python applications"
authors = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
maintainers = [{name = "dceoy", email = "dceoy@users.noreply.github.com"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">= 3.11, < 3.15"
dependencies = [
  "pdmt5 >= 1.2.0",
  "pandas >= 2.2.2",
  "typer >= 0.26.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
parquet = ["pyarrow >= 19.0.0"]
otel = [
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
]

[project.scripts]
mt5cli = "mt5cli.cli:main"

[project.urls]
Repository = "https://github.com/dceoy/mt5cli.git"

[tool.uv]
required-environments = ["platform_system == 'Windows'"]
exclude-newer = "1 week"
exclude-newer-package = { pdmt5 = false }

[dependency-groups]
dev = [
  "ruff >= 0.11.0",
  "pyright >= 1.1.407",
  "pytest>=9.0.3",
  "pytest-mock >= 3.12.0",
  "pytest-cov >= 5.0.0",
  "pandas-stubs >= 2.2.3.250527",
  "pyarrow >= 19.0.0",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "mkdocs >= 1.6.1",
  "mkdocs-material >= 9.7.6",
  "mkdocstrings[python] >= 1.0.4",
  "pymdown-extensions >= 10.21.2",
]

[tool.ruff]
line-length = 88
exclude = ["build", ".venv"]
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY",  # flake8-copyright (CPY)
  "COM812",   # missing-trailing-comma
  "FBT001",   # boolean-type-hint-positional-argument
  "FBT002",   # boolean-default-value-positional-argument
]

[tool.ruff.lint.per-file-ignores]
# __all__ is derived from mt5cli.sdk's public imports; contract tests enforce
# that the package-root exports match that single declaration.
"mt5cli/__init__.py" = [
  "F401",     # Unused import (for __all__)
]
"tests/**/*.py" = [
  "DOC201",   # Missing return documentation
  "DOC501",   # Raised exception missing from docstring
  "PLC2701",  # Private name import
  "PLR0904",  # Too many public methods
  "PLR2004",  # Magic value used in comparison
  "PLR6301",  # Method could be function/static/classmethod
  "S101",     # Use of assert (acceptable in tests)
  "S106",     # Possible hardcoded password
  "SLF001",   # Private member accessed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-public-methods = 40

[tool.pyright]
exclude = ["build", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = [
  "--cov=mt5cli",
  "--cov-branch",
  "--doctest-modules",
  "--capture=no",
]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
minversion = "6.0"

[tool.coverage.run]
source = ["mt5cli"]
omit = [
  "**/__init__.py",
  "**/__main__.py",
  "tests/**",
]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "^\\s+\\.\\.\\.$",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
